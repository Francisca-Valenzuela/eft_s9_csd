server.port=${PORT:8080}

# ===============================
# 1. STRING DE CONEXIÓN A MYSQL (ACTIVO PARA RAILWAY)
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:veterinaria_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:admin_vet}
spring.datasource.password=${MYSQLPASSWORD:admin_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# 2. CONFIGURACIÓN DE HIBERNATE/JPA
# ===============================
# Cambiamos create-drop por update para no perder datos en producción
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true


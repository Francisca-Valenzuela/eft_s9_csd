# ===================================================================
# 2. MODO PRODUCCIÓN: MYSQL 
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:mydatabase}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:myuser}
spring.datasource.password=${MYSQLPASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Logs de auditoría ---
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=trace
logging.level.com=INFO
logging.file.name=backend.log
spring.jpa.open-in-view=false
